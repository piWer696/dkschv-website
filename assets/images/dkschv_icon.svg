<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">

  <defs>
    <linearGradient id="dkschvDarkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="dkschvCyanStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="dkschvRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Container with subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#dkschvDarkBg)" stroke="#1e293b" stroke-width="4" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#dkschvCyanStroke)" stroke-width="2" stroke-opacity="0.35" />

  <!-- Corner Tech Brackets -->
  <path d="M 96 74 L 66 74 L 66 104" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" opacity="0.55" />
  <path d="M 416 74 L 446 74 L 446 104" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" opacity="0.55" />
  <path d="M 96 438 L 66 438 L 66 408" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" opacity="0.55" />
  <path d="M 416 438 L 446 438 L 446 408" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" opacity="0.55" />

  <!-- Shield Centered (Scaled to fill nicely) -->
  <g transform="translate(108, 48) scale(2.1)">
    
  <!-- Outer Shield Shadow & Contour -->
  <path d="M 70 8 
           C 112 8, 140 18, 145 24
           C 145 84, 130 144, 70 176
           C 10 144, -5 84, -5 24
           C 0 18, 28 8, 70 8 Z"
        fill="url(#dkschvDarkBg)"
        stroke="url(#dkschvCyanStroke)"
        stroke-width="4.5"
        stroke-linejoin="round" />

  <!-- Inner Cyber Grid Accent -->
  <path d="M 70 18
           C 104 18, 126 26, 130 30
           C 130 78, 118 128, 70 156
           C 22 128, 10 78, 10 30
           C 14 26, 36 18, 70 18 Z"
        fill="none"
        stroke="#38bdf8"
        stroke-width="1.8"
        stroke-opacity="0.45"
        stroke-dasharray="8 4" />

  <!-- Cyber Node & Circuit Keyhole -->
  <circle cx="70" cy="56" r="15" fill="none" stroke="#38bdf8" stroke-width="3" />
  <path d="M 62 68 L 58 86 L 82 86 L 78 68 Z" fill="#0ea5e9" opacity="0.35" stroke="#0ea5e9" stroke-width="1.8" />

  <!-- Swiss Red Crest -->
  <path d="M 70 76
           C 92 76, 106 81, 108 84
           C 108 116, 96 148, 70 166
           C 44 148, 32 116, 32 84
           C 34 81, 48 76, 70 76 Z"
        fill="url(#dkschvRed)"
        stroke="#ffffff"
        stroke-width="2.4" />

  <!-- Authentic Swiss Cross -->
  <g fill="#ffffff">
    <rect x="64" y="98" width="12" height="36" rx="1.5" />
    <rect x="52" y="110" width="36" height="12" rx="1.5" />
  </g>

  </g>
</svg>